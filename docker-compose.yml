# Standard self-hosting path: app + Postgres.
#
# Quick start:
#   1. cp .env.example .env   and edit values (at minimum SESSION_SECRET, APP_URL)
#   2. docker compose up -d
#   3. open http://localhost:3000  (health at /api/health)
#
# The app image is pulled from GHCR by default. To build locally instead, run:
#   docker compose up -d --build
services:
  db:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commute}
      POSTGRES_DB: ${POSTGRES_DB:-commute}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commute} -d ${POSTGRES_DB:-commute}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    # `docker compose up -d`         → pulls the published GHCR image.
    # `docker compose up -d --build` → builds locally and tags it as this image.
    image: ${COMMUTE_IMAGE:-ghcr.io/brandxn-dp/commute:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://commute:commute@db:5432/commute}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional: leave unset to have the app generate and persist one on first
      # boot. Set it only if you want to control the value explicitly (32+ chars).
      SESSION_SECRET: ${SESSION_SECRET:-}
      PORT: ${PORT:-3000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/New_York}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRAVEL_PROVIDER: ${TRAVEL_PROVIDER:-fixed}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db-data:
