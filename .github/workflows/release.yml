name: Release

# Generates a GitHub Release with an auto-generated changelog when a semver tag
# is pushed. Image publishing for the tag is handled by ci.yml (build-and-push).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
